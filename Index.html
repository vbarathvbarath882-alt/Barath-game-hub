<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BARATH GAME HUB</title><style>*{box-sizing:border-box}body{margin:0;background:#0b0b16;color:white;font-family:Arial,sans-serif}header{padding:28px 12px;text-align:center;background:linear-gradient(120deg,#6c2cff,#00cfff)}h1{margin:0;font-size:32px}nav{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:15px}button,a{background:#733dff;color:white;border:0;padding:11px 15px;border-radius:9px;text-decoration:none;cursor:pointer;font-weight:bold}button.active,.play{background:#00b889}.search{text-align:center;padding:10px}input{width:min(90%,450px);padding:14px;border-radius:10px;border:0;font-size:16px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;padding:20px}.card{background:#1b1b2d;text-align:center;border-radius:15px;padding-bottom:18px;overflow:hidden}.cover{height:130px;display:grid;place-items:center;font-size:55px;background:linear-gradient(135deg,#5325a9,#008dba)}.card p{color:#ccc;min-height:36px;padding:0 10px}.card a{display:inline-block;margin:5px;font-size:13px}footer{text-align:center;padding:25px;color:#aaa}</style></head><body><header><h1>🎮 BARATH GAME HUB</h1><p>Discover Games • Play Online • Download</p></header><nav><button class="active" onclick="category('All',this)">All Games</button><button onclick="category('Racing',this)">🏎 Racing</button><button onclick="category('Puzzle',this)">🧩 Puzzle</button><button onclick="category('Action',this)">🎯 Action</button><button onclick="category('Adventure',this)">🌍 Adventure</button></nav><div class="search"><input id="q" placeholder="🔍 Search your favourite game..." oninput="show()"></div><div class="grid" id="games"></div><footer>© 2026 BARATH GAME HUB | Play Safe 🎮</footer><script>const games=[{n:"2048",e:"🔢",c:"Puzzle",d:"Merge numbers in a fun puzzle.",p:"https://play2048.co/",s:"https://play2048.co/"},{n:"Chess",e:"♟️",c:"Puzzle",d:"Play chess online for free.",p:"https://lichess.org/",s:"https://lichess.org/"},{n:"Chrome Dino",e:"🦖",c:"Adventure",d:"Jump and avoid obstacles.",p:"https://chromedino.com/",s:"https://chromedino.com/"},{n:"Krunker",e:"🎯",c:"Action",d:"Fast-paced browser shooter.",p:"https://krunker.io/",s:"https://krunker.io/"},{n:"HexGL Racing",e:"🏎️",c:"Racing",d:"Futuristic browser racing.",p:"https://hexgl.bkcore.com/",s:"https://github.com/BKcore/HexGL"},{n:"Scratch Games",e:"🕹️",c:"Adventure",d:"Explore community-made games.",p:"https://scratch.mit.edu/explore/projects/games/",s:"https://scratch.mit.edu/explore/projects/games/"},{n:"Roblox",e:"🌎",c:"Adventure",d:"Explore player-created experiences.",p:"https://www.roblox.com/",s:"https://www.roblox.com/download"},{n:"Minecraft",e:"⛏️",c:"Adventure",d:"Build and explore block worlds.",p:"https://www.minecraft.net/",s:"https://www.minecraft.net/download"},{n:"SuperTuxKart",e:"🏁",c:"Racing",d:"Open-source kart racing game.",p:"https://supertuxkart.net/",s:"https://supertuxkart.net/Download"},{n:"Luanti",e:"🧱",c:"Adventure",d:"Open-source sandbox building game.",p:"https://luanti.org/",s:"https://www.luanti.org/downloads/"}];let selected="All";function category(c,b){selected=c;document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");show()}function show(){let q=document.getElementById("q").value.toLowerCase();let list=games.filter(g=>(selected==="All"||g.c===selected)&&(g.n+" "+g.d+" "+g.c).toLowerCase().includes(q));document.getElementById("games").innerHTML=list.map(g=>`<div class="card"><div class="cover">${g.e}</div><h2>${g.n}</h2><p>${g.d}</p><a class="play" href="${g.p}" target="_blank" rel="noopener">▶ PLAY ONLINE</a><a href="${g.s}" target="_blank" rel="noopener">⬇ DOWNLOAD / SITE</a></div>`).join("")||"<p>No games found.</p>"}show();</script></body></html>
